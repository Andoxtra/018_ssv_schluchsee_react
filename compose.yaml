services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"
      SITE_ORIGIN: https://${SITE_HOST:?Set SITE_HOST to the public domain}
    volumes:
      - club-data:/app/var
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/news').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST to the public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  club-data:
  caddy-data:
  caddy-config:
